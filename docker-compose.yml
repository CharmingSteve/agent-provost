services:
  alpaca-mcp:
    build:
      context: .
      dockerfile: alpaca-mcp.Dockerfile
    image: agent-provost-alpaca-mcp:${ALPACA_IMAGE_TAG:-latest}
    container_name: alpaca-mcp
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${PROVOST_SECRETS_DIR:-./.secrets}:/run/secrets:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TRADE_API_URL: "http://agent-provost:8081/trading"
      DATA_API_URL: "http://agent-provost:8081/data"
      BROKER_API_URL: "http://agent-provost:8081/broker"
    expose:
      - "8088"
    networks:
      - mcp_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    pids_limit: 256
    restart: unless-stopped

  agent-provost:
    image: openresty/openresty@sha256:4dcb9e26b5872609488cf3b6d47c330faec246978d54f8d2812b65431d789b50
    container_name: agent-provost
    depends_on:
      - alpaca-mcp
    ports:
      - "8088:8000"
    expose:
      - "8081"
    volumes:
      - ./default.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./lua:/etc/nginx/lua:ro
      - ./rules.json:/etc/rules.json:ro
      - ${PROVOST_SECRETS_DIR:-./.secrets}:/run/secrets:ro
      - ./nginx-logs:/data/nginx-logs
    networks:
      - mcp_internal
      - proxy_egress
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 256
    restart: unless-stopped

networks:
  mcp_internal:
    internal: true
  proxy_egress:
