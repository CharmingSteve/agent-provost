services:
  alpaca-mcp:
    build:
      context: .
      dockerfile: alpaca-mcp.Dockerfile
    image: agent-provost-alpaca-mcp:${ALPACA_IMAGE_TAG:-latest}
    container_name: alpaca-mcp
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${PROVOST_SECRETS_DIR:-./.secrets}:/run/secrets:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TRADE_API_URL: "http://agent-provost:8081/trading"
      DATA_API_URL: "http://agent-provost:8081/data"
      BROKER_API_URL: "http://agent-provost:8081/broker"
    expose:
      - "8088"
    networks:
      - mcp_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    pids_limit: 256
    restart: unless-stopped

  agent-provost:
    # Pinned digest from OpenResty tag: openresty/openresty:1.29.2.3-alpine
    # (multi-arch index for linux/amd64 + linux/arm64; image labels show resty_version=1.29.2.3).
    # Note: this tag can move over time, so always copy the digest for the exact tag/revision you want.
    # Example: docker manifest inspect openresty/openresty:1.29.2.3-alpine --verbose
    image: openresty/openresty@sha256:589a5b1396643da5fcf92b11b69a5a0c54ac7033b38c30d02f6598dd4cd4db60
    container_name: agent-provost
    depends_on:
      - alpaca-mcp
    ports:
      - "8088:8000"
    expose:
      - "8081"
    volumes:
      - ./default.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./lua:/etc/nginx/lua:ro
      - ./rules.json:/etc/rules.json:ro
      - ${PROVOST_SECRETS_DIR:-./.secrets}:/run/secrets:ro
      - ./nginx-logs:/data/nginx-logs
    networks:
      - mcp_internal
      - proxy_egress
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 256
    restart: unless-stopped

networks:
  mcp_internal:
    internal: true
  proxy_egress:
