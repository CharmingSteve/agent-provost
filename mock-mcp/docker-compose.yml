services:
  sovereign-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sovereign-mock-api:latest
    container_name: sovereign-api
    command: ["uvicorn", "mock_api:app", "--host", "0.0.0.0", "--port", "9000"]
    expose:
      - "9000"
    networks:
      - mcp_internal
    restart: unless-stopped

  nabatech-node:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: sovereign-mock-mcp:latest
    container_name: nabatech-node
    depends_on:
      - sovereign-api
      - agent-provost
    environment:
      SOVEREIGN_API_URL: "http://mock-agent-provost:8081/sovereign"
    command: ["uvicorn", "mock_mcp:app", "--host", "0.0.0.0", "--port", "8088"]

  mock-mcp:
    build:
      context: .
      dockerfile: mock-harness.Dockerfile
    container_name: mock-mcp
    command: ["python", "mock_mcp.py"]
    environment:
      SOVEREIGN_API_URL: "http://mock-agent-provost:8081"
      REQUEST_TIMEOUT_SECONDS: "15"
    expose:
      - "8088"
    networks:
      - mcp_internal
    restart: unless-stopped

  agent-provost:
    image: openresty/openresty@sha256:4dcb9e26b5872609488cf3b6d47c330faec246978d54f8d2812b65431d789b50
    container_name: mock-agent-provost
    depends_on:
      - sovereign-api
      - mock-mcp
    ports:
      - "18088:8000"
    expose:
      - "8081"
    volumes:
      - ./default.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx-logs:/data/nginx-logs
    networks:
      mcp_internal:
        aliases:
          - agent-provost
    restart: unless-stopped

networks:
  mcp_internal:
    internal: true
