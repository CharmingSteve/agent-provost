services:
  sovereign-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sovereign-mock-api:latest
    container_name: sovereign-api
    command: uvicorn mock_api:app --host 0.0.0.0 --port 9000
    expose:
      - "9000"
    networks:
      - mcp_internal
    restart: unless-stopped

  nabatech-node:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: sovereign-mock-mcp:latest
    container_name: nabatech-node
    depends_on:
      - sovereign-api
      - agent-provost
    environment:
      SOVEREIGN_API_URL: "http://agent-provost:8081/sovereign"
    command: uvicorn mock_mcp:app --host 0.0.0.0 --port 8088
    expose:
      - "8088"
    networks:
      - mcp_internal
    restart: unless-stopped

  agent-provost:
    image: openresty/openresty:1.27.1.2-2-alpine-fat
    container_name: sovereign-agent-provost
    depends_on:
      - sovereign-api
    ports:
      - "18088:8000"
    expose:
      - "8081"
    volumes:
      - ./default.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx-logs:/data/nginx-logs
    networks:
      - mcp_internal
    restart: unless-stopped

networks:
  mcp_internal:
    internal: true
