worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Unified audit log format capturing both hops
    log_format json_full escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"request_body":"$req_body",'
      '"resp_body":"$resp_body"'
    '}';

    # ==================================================================
    # HOP 1: Mock MCP endpoint (receives LLM -> Agent Provost -> MCP)
    # ==================================================================
    server {
        listen 8088;
        server_name localhost;

        access_log /data/nginx-logs/hop1_mock_access.log json_full;
        error_log  /data/nginx-logs/hop1_mock_error.log info;

        set $req_body "";
        set $resp_body "";

        location / {
            lua_need_request_body on;

            content_by_lua_block {
                local req_body = ngx.req.get_body_data() or ""
                ngx.var.req_body = req_body
                local resp = '{"jsonrpc":"2.0","result":{"mock":"hop1_response"},"id":1}'
                ngx.var.resp_body = resp
                ngx.header["Content-Type"] = "application/json"
                ngx.say(resp)
            }
        }
    }

    # ==================================================================
    # HOP 2: Mock API endpoint (receives MCP -> Agent Provost -> API)
    # ==================================================================
    server {
        listen 8081;
        server_name localhost;

        access_log /data/nginx-logs/hop2_mock_access.log json_full;
        error_log  /data/nginx-logs/hop2_mock_error.log info;

        set $req_body "";
        set $resp_body "";

        location / {
            lua_need_request_body on;

            content_by_lua_block {
                local req_body = ngx.req.get_body_data() or ""
                ngx.var.req_body = req_body
                local resp = '{"mock":"hop2_api_response","status":"ok"}'
                ngx.var.resp_body = resp
                ngx.header["Content-Type"] = "application/json"
                ngx.say(resp)
            }
        }
    }
}
