worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format json_full escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"request_body":"$req_body",'
      '"resp_body":"$resp_body"'
    '}';

    # ==============================================================
    # HOP 1: LLM -> MCP
    # ==============================================================
    server {
        listen 8000;
        server_name localhost;

        access_log /data/nginx-logs/llm_to_mcp_access.log json_full;
        error_log  /data/nginx-logs/llm_to_mcp_error.log info;

        set $req_body "";
        set $resp_body "";

        location / {
            lua_need_request_body on;

            access_by_lua_block {
                local req_body = ngx.req.get_body_data()
                if req_body then
                    ngx.var.req_body = req_body

                    local cjson = require "cjson.safe"
                    local parsed = cjson.decode(req_body)
                    if not parsed then
                        return
                    end

                    local args = nil
                    local method = parsed.method

                    -- Supports direct execute_transaction RPC style.
                    if method == "execute_transaction" and parsed.params then
                        args = parsed.params.arguments or parsed.params
                    end

                    -- Supports MCP tools/call wrapper style.
                    if method == "tools/call" and parsed.params and parsed.params.name == "execute_transaction" then
                        args = parsed.params.arguments or {}
                    end

                    if args then
                        local qty = tonumber(args.qty) or tonumber(args.quantity)
                        local ticker = tostring(args.ticker or "")

                        if (qty and qty > 100) or ticker == "GME" then
                            ngx.status = 403
                            ngx.header["Content-Type"] = "application/json"
                            ngx.say('{"error":"PROVOST_INTERVENTION: Risk policy blocked execute_transaction (qty > 100 or ticker == GME)."}')
                            return ngx.exit(403)
                        end
                    end
                end
            }

            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local MAX_CAPTURE_BYTES = 65536
                local buffered = ngx.ctx.buffered or ""
                if #buffered < MAX_CAPTURE_BYTES and chunk and #chunk > 0 then
                    local remaining = MAX_CAPTURE_BYTES - #buffered
                    if #chunk > remaining then
                        buffered = buffered .. string.sub(chunk, 1, remaining)
                    else
                        buffered = buffered .. chunk
                    end
                    ngx.ctx.buffered = buffered
                end
                if ngx.arg[2] then
                    ngx.var.resp_body = buffered
                end
            }

            proxy_pass http://mock-mcp:8088;
            proxy_set_header Host 127.0.0.1:8088;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # ==============================================================
    # HOP 2: MCP -> Sovereign API
    # ==============================================================
    server {
        listen 8081;
        server_name localhost;

        access_log /data/nginx-logs/mcp_to_api_access.log json_full;
        error_log  /data/nginx-logs/mcp_to_api_error.log info;

        set $req_body "";
        set $resp_body "";

        location / {
            lua_need_request_body on;

            access_by_lua_block {
                local req_body = ngx.req.get_body_data()
                if req_body then
                    ngx.var.req_body = req_body
                end
            }

            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local MAX_CAPTURE_BYTES = 65536
                local buffered = ngx.ctx.buffered or ""
                if #buffered < MAX_CAPTURE_BYTES and chunk and #chunk > 0 then
                    local remaining = MAX_CAPTURE_BYTES - #buffered
                    if #chunk > remaining then
                        buffered = buffered .. string.sub(chunk, 1, remaining)
                    else
                        buffered = buffered .. chunk
                    end
                    ngx.ctx.buffered = buffered
                end
                if ngx.arg[2] then
                    ngx.var.resp_body = buffered
                end
            }

            proxy_pass http://sovereign-api:9000;
            proxy_set_header Host sovereign-api;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
