worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format json_full escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"request_body":"$req_body",'
      '"resp_body":"$resp_body"'
    '}';

    server {
        listen 8000;
        server_name localhost;

        access_log /data/nginx-logs/llm_to_mcp_access.log json_full;
        error_log  /data/nginx-logs/llm_to_mcp_error.log info;

        set $req_body "";
        set $resp_body "";

        location / {
            lua_need_request_body on;

            access_by_lua_block {
                local req_body = ngx.req.get_body_data()
                if req_body then
                    ngx.var.req_body = req_body

                    local cjson = require "cjson.safe"
                    local parsed = cjson.decode(req_body)
                    if parsed and parsed.method == "tools/call"
                       and parsed.params
                       and parsed.params.name == "execute_sovereign_transfer"
                       and parsed.params.arguments then
                        local args = parsed.params.arguments
                        local action = tostring(args.action or "")
                        local amount = tonumber(args.amount)

                        if action == "mint" or (amount and amount > 1000000) then
                            ngx.status = 403
                            ngx.header["Content-Type"] = "application/json"
                            ngx.say('{"error": "PROVOST_INTERVENTION: Sovereign Policy Violation. Unauthorized Minting or Amount Exceeds Reserve Limits."}')
                            return ngx.exit(403)
                        end
                    end
                end
            }

            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local MAX_CAPTURE_BYTES = 65536
                local buffered = ngx.ctx.buffered or ""
                if #buffered < MAX_CAPTURE_BYTES and chunk and #chunk > 0 then
                    local remaining = MAX_CAPTURE_BYTES - #buffered
                    if #chunk > remaining then
                        buffered = buffered .. string.sub(chunk, 1, remaining)
                    else
                        buffered = buffered .. chunk
                    end
                    ngx.ctx.buffered = buffered
                end
                if ngx.arg[2] then
                    ngx.var.resp_body = buffered
                end
            }

            proxy_pass http://nabatech-node:8088;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }

    server {
        listen 8081;
        server_name localhost;

        access_log /data/nginx-logs/mcp_to_api_access.log json_full;
        error_log  /data/nginx-logs/mcp_to_api_error.log info;

        set $req_body "";
        set $resp_body "";

        location /sovereign/ {
            lua_need_request_body on;

            access_by_lua_block {
                local req_body = ngx.req.get_body_data()
                if req_body then
                    ngx.var.req_body = req_body
                end
            }

            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local MAX_CAPTURE_BYTES = 65536
                local buffered = ngx.ctx.buffered or ""
                if #buffered < MAX_CAPTURE_BYTES and chunk and #chunk > 0 then
                    local remaining = MAX_CAPTURE_BYTES - #buffered
                    if #chunk > remaining then
                        buffered = buffered .. string.sub(chunk, 1, remaining)
                    else
                        buffered = buffered .. chunk
                    end
                    ngx.ctx.buffered = buffered
                end
                if ngx.arg[2] then
                    ngx.var.resp_body = buffered
                end
            }

            rewrite ^/sovereign(/.*)$ $1 break;
            proxy_pass http://sovereign-api:9000;
            proxy_set_header Host sovereign-api;
        }
    }
}
