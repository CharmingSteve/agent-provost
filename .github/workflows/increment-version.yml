name: Increment Patch Version On PR Close

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    if: ${{ github.event.pull_request.base.ref == 'main' && !startsWith(github.event.pull_request.head.ref, 'version-bump/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump only patch in version.txt
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f version.txt ]]; then
            echo "version.txt missing; skipping without failure"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(tr -d '\r\n' < version.txt)"

          if [[ "$current" =~ ^(v?)([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            prefix="${BASH_REMATCH[1]}"
            major="${BASH_REMATCH[2]}"
            minor="${BASH_REMATCH[3]}"
            patch="${BASH_REMATCH[4]}"
            suffix="${BASH_REMATCH[5]}"

            new_patch=$((patch + 1))
            new_version="${prefix}${major}.${minor}.${new_patch}${suffix}"

            echo "$new_version" > version.txt
            echo "Version: $current -> $new_version"
            echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version.txt is not semver-like; skipping without failure"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Create version bump PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump patch version after PR close"
          title: "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          body: "Automated patch version bump after PR close."
          branch: "version-bump/${{ github.event.pull_request.number }}-${{ github.run_id }}"
          delete-branch: true
          base: main
          labels: automation
          add-paths: |
            version.txt
