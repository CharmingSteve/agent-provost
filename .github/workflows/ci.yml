name: CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main

# Restrict the default GITHUB_TOKEN to read-only; jobs that need more
# permissions declare their own permissions block explicitly.
permissions:
  contents: read

jobs:
  build-secure-push-test:
    name: Build -> Secure -> Push -> Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Step 1 (Build) - Build alpaca image with latest and SHA tags
        run: |
          set -euo pipefail
          IMAGE_URI="public.ecr.aws/e2u9m9o7/agent-provost"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build -f alpaca-mcp.Dockerfile \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${GITHUB_SHA}" \
            .

      - name: Step 2 (Security Tests) - Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Step 2 (Security Tests) - Trivy filesystem scan
        run: |
          set +e
          trivy fs --exit-code 1 --severity CRITICAL,HIGH .
          echo "TRIVY_FS_STATUS=$?" >> "$GITHUB_ENV"

      - name: Step 2 (Security Tests) - Trivy image scan (agent-provost image)
        run: |
          set +e
          trivy image --exit-code 1 --severity CRITICAL,HIGH "${IMAGE_URI}:latest"
          echo "TRIVY_ALPACA_MCP_STATUS=$?" >> "$GITHUB_ENV"

      - name: Step 2 (Security Tests) - Trivy image scan (openresty base)
        run: |
          set +e
          trivy image --exit-code 1 --severity CRITICAL,HIGH openresty/openresty@sha256:16527c6c0a8119dc948933718bf2e4a5366bc62b5b3cd72881999852ceaea94c
          echo "TRIVY_OPENRESTY_STATUS=$?" >> "$GITHUB_ENV"

      - name: Step 2 (Security Tests) - Fail if Trivy scans failed
        run: |
          if [ "${TRIVY_FS_STATUS:-0}" -ne 0 ] || [ "${TRIVY_OPENRESTY_STATUS:-0}" -ne 0 ] || [ "${TRIVY_ALPACA_MCP_STATUS:-0}" -ne 0 ]; then
            echo "One or more Trivy scans failed."
            exit 1
          fi

      - name: Step 3 (Authenticate to AWS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Step 4 (Login to ECR Public)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Step 4 (Push image tags)
        run: |
          set -euo pipefail
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${IMAGE_SHA_TAG}"

      - name: Step 5 (Sanity/Integration Tests) - Prepare env
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\nALPACA_PAPER_TRADE=true\n' \
            "${ALPACA_API_KEY:-dummy}" "${ALPACA_SECRET_KEY:-dummy}" > .env

      - name: Step 5 (Sanity/Integration Tests) - Pull and start compose
        run: |
          set -euo pipefail
          docker compose pull alpaca-mcp
          docker compose up -d

      - name: Step 5 (Sanity/Integration Tests) - Install bats
        run: sudo apt-get install -y bats

      - name: Step 5 (Sanity/Integration Tests) - Run existing sanity tests
        run: bats tests/shell/

      - name: Step 5 (Sanity/Integration Tests) - Cleanup
        if: always()
        run: docker compose down -v

  # ── Shell linting ──────────────────────────────────────────────────────────
  lint-shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck entrypoint.sh
          shellcheck verify_proxy_routing.sh
          shellcheck mock-mcp/verify_mock_proxy_routing.sh

  # ── Dockerfile linting ─────────────────────────────────────────────────────
  lint-dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hadolint
        run: |
          sudo wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfile
        run: |
          hadolint alpaca-mcp.Dockerfile
          hadolint mock-mcp/mock-harness.Dockerfile

  # ── Lua linting ────────────────────────────────────────────────────────────
  lint-lua:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Lint Lua test files
        run: luacheck tests/lua/

  # ── Lua unit tests ─────────────────────────────────────────────────────────
  test-lua:
    name: busted (Lua unit tests)
    runs-on: ubuntu-latest
    needs: [lint-lua]
    steps:
      - uses: actions/checkout@v4
      - name: Install busted and lua-cjson
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install busted
          sudo luarocks install lua-cjson
      - name: Run Lua unit tests
        run: busted tests/lua/

  # ── Shell unit tests ───────────────────────────────────────────────────────
  test-shell:
    name: bats (shell unit tests)
    runs-on: ubuntu-latest
    needs: [lint-shell]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run bats tests
        run: bats tests/shell/

  # ── Log schema validation ──────────────────────────────────────────────────
  log-schema-validation:
    name: Log schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate log JSON schema keys are defined in default.conf
        run: |
          set -euo pipefail
          for conf in default.conf mock-mcp/default.conf; do
            for key in time_local remote_addr request status body_bytes_sent \
                       request_time upstream_response_time request_body resp_body; do
              if ! grep -q "\"${key}\"" "$conf"; then
                echo "FAIL: key '${key}' missing from $conf log format"
                exit 1
              fi
            done
          done
          echo "PASS: all required log keys found in both proxy configs"

  # ── Trivy filesystem scan ──────────────────────────────────────────────────
  security-trivy:
    name: Trivy (filesystem / image scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set short commit tag for alpaca image
        run: echo "ALPACA_IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Prepare CI env file for compose parsing
        run: |
          printf 'ALPACA_API_KEY=dummy\nALPACA_SECRET_KEY=dummy\nALPACA_PAPER_TRADE=true\n' > .env
      - name: Validate docker compose spec
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate mock harness compose spec
        run: docker compose -f mock-mcp/docker-compose.yml config --quiet
      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: |
          set +e
          trivy fs --exit-code 1 --severity CRITICAL,HIGH .
          echo "TRIVY_FS_STATUS=$?" >> "$GITHUB_ENV"
      - name: Pull and build images for scan
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml pull agent-provost
          docker build -f alpaca-mcp.Dockerfile -t agent-provost-alpaca-mcp:${ALPACA_IMAGE_TAG} .
          docker compose -f mock-mcp/docker-compose.yml pull agent-provost
          docker compose -f mock-mcp/docker-compose.yml build mock-mcp sovereign-api
      - name: Trivy image scan (agent-provost)
        run: |
          set +e
          trivy image --exit-code 1 --severity CRITICAL,HIGH openresty/openresty@sha256:16527c6c0a8119dc948933718bf2e4a5366bc62b5b3cd72881999852ceaea94c
          echo "TRIVY_OPENRESTY_STATUS=$?" >> "$GITHUB_ENV"
      - name: Trivy image scan (alpaca-mcp build output)
        run: |
          set +e
          docker image inspect "agent-provost-alpaca-mcp:${ALPACA_IMAGE_TAG}" >/dev/null
          trivy image --exit-code 1 --severity CRITICAL,HIGH "agent-provost-alpaca-mcp:${ALPACA_IMAGE_TAG}"
          echo "TRIVY_ALPACA_MCP_STATUS=$?" >> "$GITHUB_ENV"
      - name: Trivy image scan (mock harness build outputs)
        run: |
          set +e
          docker image inspect mock-mcp-mock-mcp:latest >/dev/null
          trivy image --exit-code 1 --severity CRITICAL,HIGH mock-mcp-mock-mcp:latest
          if docker image inspect mock-mcp-sovereign-api:latest >/dev/null 2>&1; then
            SOVEREIGN_IMAGE="mock-mcp-sovereign-api:latest"
          elif docker image inspect sovereign-mock-api:latest >/dev/null 2>&1; then
            SOVEREIGN_IMAGE="sovereign-mock-api:latest"
          else
            echo "Could not find sovereign mock image tag"
            exit 1
          fi
          trivy image --exit-code 1 --severity CRITICAL,HIGH "$SOVEREIGN_IMAGE"
          echo "TRIVY_MOCK_HARNESS_STATUS=$?" >> "$GITHUB_ENV"
      - name: Fail if any Trivy scan failed
        run: |
          if [ "${TRIVY_FS_STATUS:-0}" -ne 0 ] || [ "${TRIVY_OPENRESTY_STATUS:-0}" -ne 0 ] || [ "${TRIVY_ALPACA_MCP_STATUS:-0}" -ne 0 ] || [ "${TRIVY_MOCK_HARNESS_STATUS:-0}" -ne 0 ]; then
            echo "One or more Trivy scans failed."
            exit 1
          fi

  # ── Checkov IaC security scan ──────────────────────────────────────────────
  security-checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: checkov --directory . --framework dockerfile,github_actions,yaml --quiet

  # ── Secrets detection ──────────────────────────────────────────────────────
  security-gitleaks:
    name: Gitleaks (secrets detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --config .gitleaks.toml

  # ── Credentials gate (sets output used by integration-tests) ─────────────────
  check-credentials:
    name: Check Alpaca credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Integration tests (requires Alpaca credentials) ────────────────────────
  integration-tests:
    name: Integration tests (end-to-end)
    runs-on: ubuntu-latest
    needs: [check-credentials, test-lua, test-shell, log-schema-validation]
    if: ${{ needs.check-credentials.outputs.enabled == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Prepare env
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\nALPACA_PAPER_TRADE=true\n' \
            "$ALPACA_API_KEY" "$ALPACA_SECRET_KEY" > .env
      - name: Run Integration Tests
        run: ./verify_proxy_routing.sh
      - name: Validate nginx config in running container
        run: docker exec agent-provost nginx -t
      - name: Validate access log JSON schema
        run: |
          set -euo pipefail
          for log in nginx-logs/llm_to_alpaca_access.log nginx-logs/mcp_to_alpaca_access.log; do
            jq -e 'has("time_local") and has("remote_addr") and has("request") and
                   has("status") and has("body_bytes_sent") and has("request_time") and
                   has("upstream_response_time") and has("request_body") and
                   has("resp_body")' "${log}"
          done

  mock-harness-integration:
    name: Mock harness integration (end-to-end)
    runs-on: ubuntu-latest
    needs: [test-lua, test-shell, log-schema-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Install python3 requests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
      - name: Run mock harness verification script
        working-directory: mock-mcp
        run: ./verify_mock_proxy_routing.sh
      - name: Validate mock proxy config in running container
        run: docker exec mock-agent-provost nginx -t
