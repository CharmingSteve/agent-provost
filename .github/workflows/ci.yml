name: CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main

# Restrict the default GITHUB_TOKEN to read-only; jobs that need more
# permissions declare their own permissions block explicitly.
permissions:
  contents: read

jobs:
  # ── Shell linting ──────────────────────────────────────────────────────────
  lint-shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck entrypoint.sh
          shellcheck verify_proxy_routing.sh

  # ── Dockerfile linting ─────────────────────────────────────────────────────
  lint-dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hadolint
        run: |
          sudo wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfile
        run: hadolint alpaca-mcp.Dockerfile

  # ── Lua linting ────────────────────────────────────────────────────────────
  lint-lua:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Lint Lua test files
        run: luacheck tests/lua/

  # ── Lua unit tests ─────────────────────────────────────────────────────────
  test-lua:
    name: busted (Lua unit tests)
    runs-on: ubuntu-latest
    needs: [lint-lua]
    steps:
      - uses: actions/checkout@v4
      - name: Install busted and lua-cjson
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install busted
          sudo luarocks install lua-cjson
      - name: Run Lua unit tests
        run: busted tests/lua/

  # ── Shell unit tests ───────────────────────────────────────────────────────
  test-shell:
    name: bats (shell unit tests)
    runs-on: ubuntu-latest
    needs: [lint-shell]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run bats tests
        run: bats tests/shell/

  # ── Log schema validation ──────────────────────────────────────────────────
  log-schema-validation:
    name: Log schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate log JSON schema keys are defined in default.conf
        run: |
          set -euo pipefail
          for key in time_local remote_addr request status body_bytes_sent \
                     request_time upstream_response_time request_body resp_body; do
            if ! grep -q "\"${key}\"" default.conf; then
              echo "FAIL: key '${key}' missing from default.conf log format"
              exit 1
            fi
          done
          echo "PASS: all required log keys found in default.conf"

  # ── Trivy filesystem scan ──────────────────────────────────────────────────
  security-trivy:
    name: Trivy (filesystem / image scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI env file for compose parsing
        run: |
          printf 'ALPACA_API_KEY=dummy\nALPACA_SECRET_KEY=dummy\nALPACA_PAPER_TRADE=true\n' > .env
      - name: Validate docker compose spec
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f mock-mcp/docker-compose.yml config --quiet
      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --exit-code 1 --severity CRITICAL,HIGH .
      - name: Pull and build images for scan
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml pull agent-provost
          docker compose -f docker-compose.yml build alpaca-mcp
      - name: Trivy image scan (agent-provost)
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH openresty/openresty@sha256:dd00479e7a68b8ce1b18bcb519d74cbf2e62eb539026f3c680f2f391aeb545bb
      - name: Trivy image scan (alpaca-mcp build output)
        run: |
          set -euo pipefail
          docker image inspect agent-provost-alpaca-mcp:latest >/dev/null
          trivy image --exit-code 1 --severity CRITICAL,HIGH agent-provost-alpaca-mcp:latest

  # ── Checkov IaC security scan ──────────────────────────────────────────────
  security-checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: checkov --directory . --framework dockerfile,github_actions,yaml --quiet

  # ── Secrets detection ──────────────────────────────────────────────────────
  security-gitleaks:
    name: Gitleaks (secrets detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

  # ── Credentials gate (sets output used by integration-tests) ─────────────────
  check-credentials:
    name: Check Alpaca credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Integration tests (requires Alpaca credentials) ────────────────────────
  integration-tests:
    name: Integration tests (end-to-end)
    runs-on: ubuntu-latest
    needs: [check-credentials, test-lua, test-shell, log-schema-validation]
    if: ${{ needs.check-credentials.outputs.enabled == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Prepare env
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\nALPACA_PAPER_TRADE=true\n' \
            "$ALPACA_API_KEY" "$ALPACA_SECRET_KEY" > .env
      - name: Run Integration Tests
        run: ./verify_proxy_routing.sh
      - name: Validate nginx config in running container
        run: docker exec agent-provost nginx -t
      - name: Validate access log JSON schema
        run: |
          set -euo pipefail
          for log in nginx-logs/llm_to_alpaca_access.log nginx-logs/mcp_to_alpaca_access.log; do
            jq -e 'has("time_local") and has("remote_addr") and has("request") and
                   has("status") and has("body_bytes_sent") and has("request_time") and
                   has("upstream_response_time") and has("request_body") and
                   has("resp_body")' "${log}"
          done

  # ── Mock harness (two-hop log visibility, no credentials required) ──────────
  mock-harness:
    name: Mock harness (hop1 + hop2 debug logs)
    runs-on: ubuntu-latest
    needs: [lint-shell, log-schema-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Validate mock-mcp compose config
        run: docker compose -f mock-mcp/docker-compose.yml config --quiet
      - name: Create nginx log directory
        run: mkdir -p nginx-logs
      - name: Pull mock-mcp image
        run: docker compose -f mock-mcp/docker-compose.yml pull mock-mcp
      - name: Start mock-mcp services
        run: docker compose -f mock-mcp/docker-compose.yml up -d
      - name: Wait for hop1 mock MCP to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8088/ >/dev/null 2>&1; then
              echo "Hop 1 mock-mcp is ready"
              break
            fi
            echo "Waiting for hop1 mock-mcp... attempt $i/30"
            sleep 2
          done
      - name: Wait for hop2 mock API to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ >/dev/null 2>&1; then
              echo "Hop 2 mock-api is ready"
              break
            fi
            echo "Waiting for hop2 mock-api... attempt $i/30"
            sleep 2
          done
      - name: Send test traffic – Hop 1 (LLM -> Agent Provost -> MCP)
        run: |
          set -euo pipefail
          echo "=== Hop 1: LLM -> Agent Provost -> MCP ==="
          curl -sf -X POST http://localhost:8088/ \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"get_quote","arguments":{"symbol":"AAPL","quantity":1}},"id":1}'
          echo ""
      - name: Send test traffic – Hop 2 (MCP -> Agent Provost -> API)
        run: |
          set -euo pipefail
          echo "=== Hop 2: MCP -> Agent Provost -> API ==="
          curl -sf -X POST http://localhost:8081/ \
            -H "Content-Type: application/json" \
            -d '{"symbol":"AAPL","qty":1,"side":"buy","type":"market","time_in_force":"day"}'
          echo ""
      - name: Print container logs (all services)
        if: always()
        run: |
          echo "=== Container logs: mock-mcp ==="
          docker compose -f mock-mcp/docker-compose.yml logs --no-log-prefix
      - name: Print hop1 access log (request_body + resp_body)
        if: always()
        run: |
          echo "=== Hop 1 access log (LLM->MCP) ==="
          cat nginx-logs/hop1_mock_access.log 2>/dev/null || echo "(no log yet)"
          echo ""
          echo "--- request_body entries ---"
          jq -r '.request_body' nginx-logs/hop1_mock_access.log 2>/dev/null || echo "(none)"
          echo "--- resp_body entries ---"
          jq -r '.resp_body' nginx-logs/hop1_mock_access.log 2>/dev/null || echo "(none)"
      - name: Print hop2 access log (request_body + resp_body)
        if: always()
        run: |
          echo "=== Hop 2 access log (MCP->API) ==="
          cat nginx-logs/hop2_mock_access.log 2>/dev/null || echo "(no log yet)"
          echo ""
          echo "--- request_body entries ---"
          jq -r '.request_body' nginx-logs/hop2_mock_access.log 2>/dev/null || echo "(none)"
          echo "--- resp_body entries ---"
          jq -r '.resp_body' nginx-logs/hop2_mock_access.log 2>/dev/null || echo "(none)"
      - name: Print hop1 error log
        if: always()
        run: cat nginx-logs/hop1_mock_error.log 2>/dev/null || echo "(no hop1 error log)"
      - name: Print hop2 error log
        if: always()
        run: cat nginx-logs/hop2_mock_error.log 2>/dev/null || echo "(no hop2 error log)"
      - name: Tear down mock services
        if: always()
        run: docker compose -f mock-mcp/docker-compose.yml down --volumes
